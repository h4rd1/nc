version: '3.8'

services:
  nextcloud:
    image: nextcloud:latest
    deploy:
      replicas: 1
    networks:
      - nextcloud_net
    volumes:
      - nextcloud_data:/var/www/html
    environment:
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=nextcloud
      - POSTGRES_HOST=db:5432  # Имя сервиса базы данных
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=nextcloud
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=nextcloud
    depends_on:
      - db
      - redis

  db:
    image: postgres:14
    ports:
      - 5432:5432
    deploy:
      replicas: 1
    networks:
      - nextcloud_net
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=nextcloud
      - POSTGRES_DB=nextcloud
      - POSTGRES_PASSWORD=nextcloud

  nginx:
    image: nginx:latest
    deploy:
      replicas: 1
    ports:
      - "80:80"
      - "443:443"
    networks:
      - nextcloud_net  # Соединяем Nginx с вашей сетью
    volumes:
      - ./cert:/etc/nginx/cert
      - ./nginx.conf:/etc/nginx/nginx.conf

  onlyoffice-document-server:
    image: h4rdl/doc_srv
    deploy:
      replicas: 1
    networks:
      - nextcloud_net
    environment:
      - JWT_SECRET=secret
    volumes:
      - document_data:/var/www/onlyoffice/Data
      - document_log:/var/log/onlyoffice

  redis:
    image: "redis:alpine"
    command: redis-server --requirepass nextcloud
    networks:
      - nextcloud_net
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/var/lib/redis
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_REPLICATION_MODE=master

networks:
  nextcloud_net:
    driver: overlay  # Ваша собственная сеть

volumes:
  document_data:
  document_log:
  nextcloud_data:
  db_data:
