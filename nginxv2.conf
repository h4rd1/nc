http {
server {
    listen 80;
    server_name your_domain_or_ip;  # Замените на свой домен или IP-адрес

    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your_domain_or_ip;  # Замените на свой домен или IP-адрес

    # Путь к твоим SSL-сертификатам
    ssl_certificate /etc/nginx/cert/Cert.crt;  # Замените на путь к твоему сертификату
    ssl_certificate_key /etc/nginx/cert/Cert.key;  # Замените на путь к твоему приватному ключу

    # Рекомендуемые настройки SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'HIGH:!aNULL:!MD5';
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://nextcloud:81;  # Проксируем на сервис nextcloud
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Обрабатываем статические файлы
    location ^~ /css {
        expires 30d;
        access_log off;
    }

    location ~* ^/ds-vpath/ {
        rewrite /ds-vpath/(.*) /$1 break;
        proxy_pass http://onlyoffice-document-server;
        proxy_redirect off;

        client_max_body_size 100m;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;  # Исправлено
        proxy_set_header X-Forwarded-Proto $scheme;  # Исправлено
    }

    location ~ \.php(?:$|/) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;  # Изменено на on
        fastcgi_param modHeadersAvailable true; #Avoid sending the security headers twice
        fastcgi_pass backend;  # Убедитесь, что у вас правильно настроен этот блок
        fastcgi_intercept_errors on;
    }

    location ^~ /js {
        expires 30d;
        access_log off;
    }

    location ^~ /images {
        expires 30d;
        access_log off;
    }

    location ^~ /apps {
        expires 30d;
        access_log off;
    }

    location ^~ /ocs/v1.php {
        deny all;
    }

    location ^~ /status.php {
        deny all;
    }

    error_page 403 /core/templates/403.php;
    error_page 404 /core/templates/404.php;
    error_page 500 /core/templates/500.php;
 }
}
