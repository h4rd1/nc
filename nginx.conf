
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
server {
    listen 80;
    server_name your-domain.com;  # Замените на ваш домен

    # Перенаправление HTTP на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;  # Замените на ваш домен

    ssl_certificate /etc/nginx/cert/code.crt;  # Путь к вашему сертификату
    ssl_certificate_key /etc/nginx/cert/code.key;  # Путь к вашему приватному ключу

    # Убедитесь, что у вас включены соответствующие параметры для безопасности
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'HIGH:!aNULL:!MD5';

    location / {
        proxy_pass http://nextcloud:80;  # Проксируйте запросы к Nextcloud
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Дополнительные настройки для Nextcloud
        client_max_body_size 512M;  # Увеличьте лимит на размер тела запроса при необходимости
        proxy_buffering off;
    }

    # Дополнительные настройки для WebDAV (если нужно)
    location /.well-known/webdav {
        proxy_pass http://nextcloud:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Kubernetes security headers
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Frame-Options SAMEORIGIN;
}
}